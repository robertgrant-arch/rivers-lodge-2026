services:
  - type: web
    name: rivers-lodge
    runtime: node
    region: oregon
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: OWNER_OPEN_ID
        sync: false
      - key: OWNER_NAME
        sync: false
      - key: BUILT_IN_FORGE_API_URL
        sync: false
      - key: BUILT_IN_FORGE_API_KEY
        sync: false
      - key: VITE_FRONTEND_FORGE_API_KEY
        sync: false
      - key: VITE_FRONTEND_FORGE_API_URL
        sync: false
      - key: VITE_APP_TITLE
        value: The Rivers Lodge & Hunt Club
      - key: VITE_ANALYTICS_ENDPOINT
        sync: false
      - key: VITE_ANALYTICS_WEBSITE_ID
        sync: false
      # DocuSign waivers (set in the dashboard; WAIVERS_DOCUSIGN_ENABLED=true turns it on)
      - key: WAIVERS_DOCUSIGN_ENABLED
        sync: false
      - key: DOCUSIGN_INTEGRATION_KEY
        sync: false
      - key: DOCUSIGN_USER_ID
        sync: false
      - key: DOCUSIGN_ACCOUNT_ID
        sync: false
      - key: DOCUSIGN_BASE_PATH
        sync: false
      - key: DOCUSIGN_OAUTH_BASE
        sync: false
      - key: DOCUSIGN_PRIVATE_KEY
        sync: false
      - key: DOCUSIGN_CONNECT_HMAC_SECRET
        sync: false
      - key: WAIVERS_OPS_EMAIL
        sync: false
